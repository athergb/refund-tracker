<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refund Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background: #f8f9fa;
            font-weight: bold;
        }
        
        .expiring {
            color: #ff6b6b;
            font-weight: bold;
        }
        
        .export-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="dashboard-header">
    <div class="dashboard-logo-section">
        <img src="images/QFClogo.png" alt="QFC Logo" class="dashboard-logo">
        <div class="dashboard-title">
            <h1>📊 Refund Dashboard</h1>
            <p>Monitor, track, and manage refund tickets</p>
        </div>
    </div>
    <div class="dashboard-actions">
    <a href="index.html" class="btn btn-add-ticket">
        ➕ Add Ticket
    </a>
    <button onclick="exportToExcel()" class="btn btn-export">
        📤 Export Excel
    </button>
</div>
</div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalTickets">0</div>
                <div>Total Tickets</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="expiringCount">0</div>
                <div>Expiring Soon</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="totalAmount">0</div>
                <div>Total Amount</div>
            </div>
        </div>
        
        <table id="ticketsTable">
            <thead>
                <tr>
                    <th>SR NO</th>
                    <th>PNR</th>
                    <th>Passenger Name</th>
                    <th>Travel Date</th>
                    <th>Expiry Date</th>
                    <th>Vendor</th>
                    <th>Vendor Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="ticketsBody">
                <!-- Tickets will appear here -->
            </tbody>
        </table>
    </div>
    
    <script src="js/dashboard.js"></script>
</body>
</html>
